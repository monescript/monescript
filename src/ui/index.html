<html>
<head>
    <title>monescript</title>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta content="utf-8" http-equiv="encoding">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/c3/0.4.18/c3.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.0.0-beta.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/main.css" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js" charset="utf-8"></script>
</head>

<body>
    <div class="dark-bar">
        <div class="container">
            <div class="row">
                <div class="col-md-12 text-center">
                    monescript - double entry accounting
                </div>
            </div>
        </div>
    </div>
    <div class="container-fluid mt-2">
        <div id="app">

            <ul class="nav nav-tabs" id="topTab" role="tablist">
                <li class="nav-item">
                    <a class="nav-link" id="open-tab" data-toggle="tab" href="#open" role="tab" aria-controls="home" aria-selected="true">Open</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" id="transactions-tab" data-toggle="tab" href="#transactions" role="tab" aria-controls="profile" aria-selected="false">Transactions</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="source-tab" data-toggle="tab" href="#source" role="tab" aria-controls="contact" aria-selected="false">Source</a>
                </li>
            </ul>
            <div class="tab-content" id="myTabContent">
                <div class="tab-pane fade mt-3" id="open" role="tabpanel" aria-labelledby="open-tab">
                    <div class="form">
                        <div class="form-group">
                            <label> Please provide a text file in a <a href="https://github.com/monescript/monescript#monescript-journal-syntax" target="_blank"> monescript format </a> </label>
                            <div>
                                <button type="button" id="choose-file-btn" class="btn btn-primary">Choose File</button>
                                <input class="d-none" type="file" id="file-input">
                            </div>
                        </div>
                        <div>
                            <pre id="errors">
                            </pre>
                        </div>
                        <div>
                            <p>There is no server-side code behind this page, all the computations are performed in your browser.</p>
                        </div>
                    </div>
                </div>
                <div class="tab-pane fade mt-3 show active" id="transactions" role="tabpanel" aria-labelledby="transactions-tab">
                    <div id="accordion" role="tablist" >
                        <div class="card">
                            <div class="card-header" role="tab" id="headingOne">
                                <h5 class="mb-0">
                                    <a data-toggle="collapse" href="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                                        Total Income and Expenses
                                    </a>
                                </h5>
                            </div>
                            <div id="collapseOne" class="collapse show" role="tabpanel" aria-labelledby="headingOne" data-parent="#accordion">
                                <div class="card-body pl-0">
                                    <div id="total-monthly-chart"></div>
                                </div>
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-header" role="tab" id="headingTwo">
                                <h5 class="mb-0">
                                    <a class="collapsed" data-toggle="collapse" href="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                                        Monthly chart
                                    </a>
                                </h5>
                            </div>
                            <div id="collapseTwo" class="collapse" role="tabpanel" aria-labelledby="headingTwo" data-parent="#accordion">
                                <div class="card-body pl-0">
                                    <div id="monthly-chart"></div>
                                </div>
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-header" role="tab" id="headingThree">
                                <h5 class="mb-0">
                                    <a class="collapsed" data-toggle="collapse" href="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
                                        Weekly chart
                                    </a>
                                </h5>
                            </div>
                            <div id="collapseThree" class="collapse" role="tabpanel" aria-labelledby="headingThree" data-parent="#accordion">
                                <div class="card-body pl-0">
                                    <div id="weekly-chart"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="mt-3">
                        <table>
                            <tr><td><div id="account-filter"></div></td></tr>
                            <tr><td>
                                <div class="mb-2 d-flex flex-wrap align-items-stretch">
                                    <button type="button" class="btn btn-sm btn-danger ml-1" data-quick-account="Expenses">Expenses</button>
                                    <button type="button" class="btn btn-sm btn-success ml-1" data-quick-account="Income">Income</button>
                                    <button type="button" class="btn btn-sm btn-info ml-1" data-quick-account="Assets">Assets</button>
                                    <button type="button" id="reload-btn" class="btn btn-sm btn-outline-secondary ml-3" title="Reload file">
                                        &#8635;
                                    </button>
                                    <span id="reloaded-flash" class="text-success ml-2 align-self-center d-none"><i class="fa fa-check"></i> Reloaded</span>
                                </div>
                                <div id="accounts"></div>
                            </td></tr>
                        </table>
                    </div>
                    <div id="transaction-table"></div>
                </div>
                <div class="tab-pane fade mt-3 ml-3" id="source" role="tabpanel" aria-labelledby="source-tab">
                    <div>
                        <pre id="file-contents">
                        </pre>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <div class="dark-bar">
        <div class="container">
            <div class="row">
                <div class="col-md-12 text-center py-1">
                    <a class="github" href="https://github.com/monescript/monescript" target="_blank">Github</a>
                    <button type="button" id="footer-reload-btn" class="btn btn-sm btn-outline-light ml-3" title="Reload file">
                        &#8635; Reload
                    </button>
                    <span id="footer-reloaded" class="text-success ml-2 d-none">&#10003; Reloaded</span>
                </div>
            </div>
        </div>
    </div>

    <script src="_js/bundle.js"></script>
</body>
</html>
